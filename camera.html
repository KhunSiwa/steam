<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Streamer Support - Camera Tracking Controller</title>
  <style>
    :root {
      --bg-primary: #090d16;
      --bg-secondary: #0f172a;
      --border-color: #1e293b;
      --border-focus: #3b82f6;
      --text-main: #f8fafc;
      --text-muted: #64748b;
      --color-success: #10b981;
      --color-danger: #ef4444;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: var(--bg-primary);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      box-sizing: border-box;
    }

    .container {
      width: 90%;
      max-width: 440px;
      background-color: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      text-align: center;
    }

    h3 {
      margin-top: 0;
      margin-bottom: 16px;
      font-size: 1.15rem;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--text-main);
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 10px;
    }

    .video-wrapper {
      position: relative;
      width: 100%;
      aspect-ratio: 4 / 3;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--border-color);
      background-color: #000;
      margin-bottom: 16px;
    }

    #webcam {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1); /* Mirror camera preview */
    }

    .status-panel {
      background-color: rgba(9, 13, 22, 0.6);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 20px;
      font-size: 0.85rem;
      text-align: left;
    }

    .status-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 6px;
    }

    .status-row:last-child {
      margin-bottom: 0;
    }

    .status-label {
      color: var(--text-muted);
      font-weight: 600;
    }

    .status-val {
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .indicator-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      display: inline-block;
    }

    .dot-active {
      background-color: var(--color-success);
      box-shadow: 0 0 8px var(--color-success);
    }

    .dot-inactive {
      background-color: var(--text-muted);
    }

    .btn-stop {
      width: 100%;
      background-color: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #fca5a5;
      padding: 12px;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .btn-stop:hover {
      background-color: var(--color-danger);
      color: #fff;
      border-color: var(--color-danger);
    }

    .loading-overlay {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: rgba(9, 13, 22, 0.85);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10;
      transition: opacity 0.3s;
    }

    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-top-color: var(--border-focus);
      border-radius: 50%;
      animation: spin 1s infinite linear;
      margin-bottom: 12px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .loading-text {
      font-size: 0.85rem;
      color: var(--text-main);
    }
  </style>

  <!-- MediaPipe CDN Dependencies -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body>

  <div class="container">
    <h3>Camera Tracking Controller</h3>
    
    <div class="video-wrapper">
      <div id="loading-mask" class="loading-overlay">
        <div class="spinner"></div>
        <div class="loading-text" id="loading-status">Initializing Web Cam...</div>
      </div>
      <video id="webcam" autoplay playsinline muted></video>
    </div>

    <div class="status-panel">
      <div class="status-row">
        <span class="status-label">Camera Connection</span>
        <span class="status-val" id="val-camera-status">
          <span class="indicator-dot dot-inactive" id="dot-camera"></span> Connecting...
        </span>
      </div>
      <div class="status-row">
        <span class="status-label">Face Analysis</span>
        <span class="status-val" id="val-face-status">
          <span class="indicator-dot dot-inactive" id="dot-face"></span> Idle
        </span>
      </div>
      <div class="status-row">
        <span class="status-label">Hand Gesture</span>
        <span class="status-val" id="val-hand-status">
          <span class="indicator-dot dot-inactive" id="dot-hand"></span> Idle
        </span>
      </div>
      <div class="status-row" style="margin-top: 8px; border-top: 1px solid var(--border-color); padding-top: 8px;">
        <span class="status-label">Active Gesture</span>
        <span class="status-val" id="val-active-gesture" style="color: var(--border-focus); font-size: 0.95rem;">NONE</span>
      </div>
    </div>

    <button class="btn-stop" id="btn-stop-tracking">Stop Camera</button>
  </div>

  <script>
    const videoEl = document.getElementById('webcam');
    const loadingMask = document.getElementById('loading-mask');
    const loadingText = document.getElementById('loading-status');
    const btnStop = document.getElementById('btn-stop-tracking');
    
    const dotCamera = document.getElementById('dot-camera');
    const valCameraStatus = document.getElementById('val-camera-status');
    
    const dotFace = document.getElementById('dot-face');
    const valFaceStatus = document.getElementById('val-face-status');
    
    const dotHand = document.getElementById('dot-hand');
    const valHandStatus = document.getElementById('val-hand-status');
    const valActiveGesture = document.getElementById('val-active-gesture');

    let stream = null;
    let cameraUtil = null;
    let faceMesh = null;
    let hands = null;
    
    let faceMeshLoaded = false;
    let handsLoaded = false;
    
    // Gesture smoothing history (5-frame sliding window)
    const gestureHistory = [];

    // Safe origin checking
    const targetOrigin = window.location.origin;

    // Send connection established notify
    function notifyConnected() {
      if (window.opener) {
        window.opener.postMessage({ type: 'camera_connected' }, targetOrigin);
      }
    }

    // Send tracking coordinates
    function sendTrackingPayload(payload) {
      if (window.opener) {
        window.opener.postMessage({
          type: 'STREAM_SUPPORT_TRACKING',
          ...payload
        }, targetOrigin);
      }
    }

    // Finger classifier helper
    function classifyGesture(handLandmarks) {
      if (!handLandmarks || handLandmarks.length === 0) return 'NONE';

      // Landmark indices: Wrist=0, ThumbTip=4, IndexTip=8, MiddleTip=12, RingTip=16, PinkyTip=20
      const isIndexExtended = handLandmarks[8].y < handLandmarks[6].y;
      const isMiddleExtended = handLandmarks[12].y < handLandmarks[10].y;
      const isRingExtended = handLandmarks[16].y < handLandmarks[14].y;
      const isPinkyExtended = handLandmarks[20].y < handLandmarks[18].y;

      // Thumb is extended if thumb tip is far enough from index knuckle base (node 5)
      const isThumbExtended = Math.hypot(handLandmarks[4].x - handLandmarks[9].x) > 
                              Math.hypot(handLandmarks[2].x - handLandmarks[9].x);

      // Check open hand gesture (wave)
      if (isIndexExtended && isMiddleExtended && isRingExtended && isPinkyExtended) {
        return 'OPEN_PALM';
      }
      
      // Check thumbs up gesture
      if (!isIndexExtended && !isMiddleExtended && !isRingExtended && !isPinkyExtended && isThumbExtended) {
        return 'THUMBS_UP';
      }
      
      // Check 3 fingers extended
      if (isIndexExtended && isMiddleExtended && isRingExtended && !isPinkyExtended) {
        return 'THREE_FINGERS';
      }
      
      // Check 2 fingers extended
      if (isIndexExtended && isMiddleExtended && !isRingExtended && !isPinkyExtended) {
        return 'TWO_FINGERS';
      }
      
      // Check 1 finger extended
      if (isIndexExtended && !isMiddleExtended && !isRingExtended && !isPinkyExtended) {
        return 'ONE_FINGER';
      }
      
      // Check fist gesture (all folded)
      if (!isIndexExtended && !isMiddleExtended && !isRingExtended && !isPinkyExtended && !isThumbExtended) {
        return 'FIST';
      }

      return 'NONE';
    }

    // Debounce sliding window majority vote
    function getStableGesture(rawGesture) {
      gestureHistory.push(rawGesture);
      if (gestureHistory.length > 5) {
        gestureHistory.shift();
      }
      const counts = {};
      let maxCount = 0;
      let stable = 'NONE';
      for (const g of gestureHistory) {
        counts[g] = (counts[g] || 0) + 1;
        if (counts[g] > maxCount) {
          maxCount = counts[g];
          stable = g;
        }
      }
      return stable;
    }

    // Track active landmarks variables
    let lastFaceData = null;
    let lastGestureData = 'NONE';

    function onFaceResults(results) {
      if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
        const landmarks = results.multiFaceLandmarks[0];
        
        // Extract only key tracking landmarks to reduce message volume
        lastFaceData = {
          nose: landmarks[4],
          cheekL: landmarks[234],
          cheekR: landmarks[454],
          forehead: landmarks[10],
          chin: landmarks[152],
          eyeL_inner: landmarks[133],
          eyeL_outer: landmarks[33],
          eyeR_inner: landmarks[362],
          eyeR_outer: landmarks[263],
          eyelidL_top: landmarks[159],
          eyelidL_bottom: landmarks[145],
          eyelidR_top: landmarks[386],
          eyelidR_bottom: landmarks[374]
        };

        dotFace.className = 'indicator-dot dot-active';
        valFaceStatus.innerHTML = '<span class="indicator-dot dot-active"></span> Active';
      } else {
        lastFaceData = null;
        dotFace.className = 'indicator-dot dot-inactive';
        valFaceStatus.innerHTML = '<span class="indicator-dot dot-inactive"></span> Searching...';
      }
      dispatchTrackingData();
    }

    function onHandResults(results) {
      if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
        const rawGesture = classifyGesture(results.multiHandLandmarks[0]);
        lastGestureData = getStableGesture(rawGesture);

        dotHand.className = 'indicator-dot dot-active';
        valHandStatus.innerHTML = '<span class="indicator-dot dot-active"></span> Active';
        valActiveGesture.textContent = lastGestureData;
      } else {
        lastGestureData = getStableGesture('NONE');
        dotHand.className = 'indicator-dot dot-inactive';
        valHandStatus.innerHTML = '<span class="indicator-dot dot-inactive"></span> Idle';
        valActiveGesture.textContent = lastGestureData;
      }
      dispatchTrackingData();
    }

    function dispatchTrackingData() {
      // Dispatches combined payload only if face exists or gesture changes
      sendTrackingPayload({
        face: lastFaceData,
        gesture: lastGestureData
      });
    }

    async function initTracking() {
      try {
        loadingText.textContent = "Requesting Webcam...";
        
        stream = await navigator.mediaDevices.getUserMedia({ 
          video: { width: 640, height: 480, frameRate: 30 } 
        });
        
        videoEl.srcObject = stream;
        
        dotCamera.className = 'indicator-dot dot-active';
        valCameraStatus.innerHTML = '<span class="indicator-dot dot-active"></span> Connected';
        
        notifyConnected();

        loadingText.textContent = "Loading Face Tracking WebAssembly...";
        faceMesh = new FaceMesh({
          locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
        });
        faceMesh.setOptions({
          maxNumFaces: 1,
          refineLandmarks: true,
          minDetectionConfidence: 0.5,
          minTrackingConfidence: 0.5
        });
        faceMesh.onResults(onFaceResults);

        loadingText.textContent = "Loading Hand Tracking WebAssembly...";
        hands = new Hands({
          locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
        });
        hands.setOptions({
          maxNumHands: 1,
          modelComplexity: 1,
          minDetectionConfidence: 0.5,
          minTrackingConfidence: 0.5
        });
        hands.onResults(onHandResults);

        // Hide overlay once setups complete
        loadingMask.style.opacity = '0';
        setTimeout(() => loadingMask.style.display = 'none', 300);

        // Run local capture loop
        cameraUtil = new Camera(videoEl, {
          onFrame: async () => {
            if (faceMesh) await faceMesh.send({ image: videoEl });
            if (hands) await hands.send({ image: videoEl });
          },
          width: 640,
          height: 480
        });
        cameraUtil.start();

      } catch (err) {
        console.error("Camera Tracking initialization failed: ", err);
        loadingText.textContent = "Error: Webcam access denied!";
        loadingText.style.color = "var(--color-danger)";
        dotCamera.className = 'indicator-dot dot-inactive';
        valCameraStatus.innerHTML = '<span class="indicator-dot dot-inactive"></span> Error';
      }
    }

    function shutdown() {
      if (window.opener) {
        window.opener.postMessage({ type: 'camera_disconnected' }, targetOrigin);
      }
      
      if (cameraUtil) {
        cameraUtil.stop();
        cameraUtil = null;
      }
      
      if (stream) {
        stream.getTracks().forEach(t => t.stop());
        stream = null;
      }

      if (faceMesh) {
        faceMesh.close();
        faceMesh = null;
      }

      if (hands) {
        hands.close();
        hands = null;
      }

      window.close();
    }

    btnStop.addEventListener('click', shutdown);
    
    // Safety disconnect on window close
    window.addEventListener('beforeunload', () => {
      if (window.opener) {
        window.opener.postMessage({ type: 'camera_disconnected' }, targetOrigin);
      }
    });

    // Start setup on page load
    window.addEventListener('DOMContentLoaded', initTracking);
  </script>
</body>
</html>
